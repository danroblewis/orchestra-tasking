<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra · Tickets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
<link rel="stylesheet" href="/plugins/tasks/static/tasks.css?v={{v}}">
<link rel="stylesheet" href="/plugins/tasks/static/tickets.css?v={{v}}">
</head>
<body>
<nav id="nav"><a href="/">Dashboard</a><a href="/machines">Machines</a><a href="/dynamics">Dynamics</a><a href="/core">Core</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="toolbar">
  <input id="filter" class="filter" placeholder="filter (id, title, state, milestone)">
  <label title="Done tickets are hidden; open a milestone to see its done tickets"><input type="checkbox" id="showdone"> show done tickets</label>
  <button onclick="collapseAll()">close all</button><button onclick="fit()">fit</button>
  <span id="legend" class="muted"></span>
  <span class="chips" id="chips"></span>
  <span class="muted hint" style="margin-left:auto">click a milestone to open it · drag or scroll to pan · pinch or ⌘/ctrl+scroll to zoom</span>
</div>
<div id="stage"><svg id="svg"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5368"/></marker>
  <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/></marker>
  <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c86a0"/></marker>
</defs><g id="view"><g id="edges"></g><g id="nodes"></g></g></svg></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script src="/plugins/tasks/static/tasks.js?v={{v}}"></script>
<script src="/plugins/tasks/static/tickets.js?v={{v}}"></script>
</body>
</html>
