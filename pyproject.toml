[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-tasking"
version = "0.1.0"
description = "A task system observed by Orchestra: tickets, the scheduler that offers them to whatever fills the worker and reviewer roles, the merge gate."
requires-python = ">=3.12"
dependencies = ["orchestra[bus-redis,sd]"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
tasking = "tasking.cli:main"

[project.entry-points."orchestra.plugins"]
tasks = "tasking.web:plugin"

[tool.uv.sources]
orchestra = { path = "../orchestra_2", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["tasking"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests", "."]          # tests import fake_machine, and the e2e demo test imports demo.run

[tool.ruff]
line-length = 100
target-version = "py312"
