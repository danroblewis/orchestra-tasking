[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-tasking"
version = "0.1.0"
description = "A task system observed by Orchestra: tickets, the scheduler that offers them to whatever fills the worker and reviewer roles, the merge gate."
requires-python = ">=3.12"
dependencies = [
    # ours is 1.0.0a1; <1.0.0rc0 keeps out the unrelated `orchestra` on PyPI (1.0.0 and up)
    "orchestra>=1.0.0a1,<1.0.0rc0",
    "psutil>=5.9",
    "fastapi>=0.115",
    "tomlkit>=0.13",   # `orchestra tasks init` adds the starter sections through Orchestra (project.config_edit) with their comments
]

[project.optional-dependencies]
# orchestra[sd]: the demo and the e2e tests start `orchestra run`, whose host rediscovers the model;
# orchestra[bus-redis]: the maintainer's own orchestra.toml at the repository root uses Redis.
# The task system itself needs neither.
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "orchestra[sd,bus-redis]"]

[project.entry-points."orchestra.commands"]
tasks = "tasking.cli:main"          # `orchestra tasks ...`; no console script of its own (Orchestra PLUGINS.md 4.10)

[project.entry-points."orchestra.plugins"]
tasks = "tasking.web:plugin"

[tool.uv]
# This repository's own environment takes Orchestra's main from GitHub (README, "Developing against a
# local Orchestra"). Read only at the root: installed as a dependency, the plugin takes the Orchestra
# it is installed with ([tool.uv.sources] would not do: uv applies a git dependency's sources).
# An override replaces every orchestra requirement, extras too, so it names the dev extra's.
override-dependencies = ["orchestra[sd,bus-redis] @ git+https://github.com/danroblewis/orchestra@main"]

[tool.hatch.build.targets.wheel]
packages = ["tasking"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests", "."]          # tests import conftest and fake_machine, and the e2e demo test imports demo.run

[tool.ruff]
line-length = 100           # what the import sorter (I001) wraps at; only `ruff check` is used, never `ruff format`
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set, nothing added or removed. Where a rule is wrong for one line, that
# line says so: `# noqa: RULE - reason` (a blind `except` that keeps the scheduler alive, a
# status check that waits for a service to come up).
