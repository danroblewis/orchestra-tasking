# Orchestra watching this repository's task system.

[events]
url = "redis://127.0.0.1:6379/3"

[metrics]
url = "http://127.0.0.1:8428"

[discovery]
strategy = "conservation"
window = "60m"
step = "30s"
every = "5m"

# ---- the task system (tasking): sections Orchestra itself ignores ----

[project]
base_branch = "main"
ticket_prefix = "TK"
push = false

[agents]
harness = "claude_code"  # pi | claude_code | codex: the product that runs the agents
model = "haiku"
thinking = "medium"
workers = 1
reviewers = 1
silence_timeout = "20m"

[gate]
batch_size = 1
timeout = "900s"

[[gate.unit]]
name = "unit"
command = "uv run python -m pytest -q tests/unit"
