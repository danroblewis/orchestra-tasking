# The task system's demo project: Orchestra, the task system, and two programs that fill the
# worker and reviewer roles (the package's tasking/machines/shell_worker.py and
# tasking/machines/check_reviewer.py). demo/run.py copies this folder to a fresh git repository
# and starts `orchestra run` and `orchestra web`; `orchestra run` starts the task system's
# scheduler (the plugin declares it) and the two machines below. See README.md.

# The worker accepts every offer (it is the only worker here) and blocks what it cannot do; in a
# project with another worker, `--only-commands` leaves the tickets without commands to it.
[[machines]]
name = "worker"
command = "python -m tasking.machines.shell_worker"   # shipped in the task system's package (tasking/machines/)

[[machines]]
name = "reviewer"
command = "python -m tasking.machines.check_reviewer"   # shipped in the package too

[events]
url = "file"             # Orchestra's bus: a JSONL file in ~/.orchestrator/<key>/

[metrics]
url = "file"

[discovery]
window = "60m"
step = "5s"      # a shell ticket lives seconds; at 30 s its whole life fits in one step and no state is a stock
every = "5m"

# ---- the task system (sections Orchestra itself ignores) ----

[project]
base_branch = "main"
ticket_prefix = "DEMO"
work = "tasks"           # a scratch folder per ticket, reviewed, nothing merged

[tasks]
workers = 2              # tickets offered to workers at once
reviewers = 1
tick = "1s"              # the scheduler's record follows a machine within a second (3 s by default would quantise every residence to 3 s)
